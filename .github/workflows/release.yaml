---
    name: "release"

    on:
      push:
        tags:
          - "*"
      workflow_dispatch:

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

    jobs:
      flutter-test:
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Install native build tools
            run: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build g++
            shell: bash
          - name: Run Flutter tests
            run: flutter test
            shell: bash

      flutter-analyze:
        runs-on: "ubuntu-latest"
        permissions:
          contents: read
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Analyze Flutter project
            run: flutter analyze --no-fatal-infos --fatal-warnings
            shell: bash

      flutter-build-android:
        name: "Release for android"
        needs: [flutter-test, flutter-analyze]
        runs-on: "ubuntu-latest"
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Extract tag name
            run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            shell: bash
          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
            shell: bash
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            id: flutter-action
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash
          - name: Remove build id
            run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
          - name: Build Flutter for Android
            run: >-
              flutter build apk --split-per-abi
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash
          - name: Package android build output
            run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk liangciyuan-${{ env.tag }}-android-arm64.apk
            shell: bash
          - name: Upload android outputs
            uses: actions/upload-artifact@v4
            with:
              name: android_outputs
              path: liangciyuan-*-android-arm64.apk

      flutter-build-windows:
        name: "Release for windows"
        needs: [flutter-build-android]
        runs-on: "windows-latest"
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4
          - name: Extract tag name
            run: |
              $tag = "${{ github.ref }}".Replace('refs/tags/', '')
              echo "tag=$tag" >> $env:GITHUB_ENV
          - name: Enable Git longpaths
            run: git config --system core.longpaths true
          # flutter-action 在 Windows 上用 yq 读取 pubspec 的 flutter-version-file。
          - name: Install yq
            run: choco install yq -y
          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
          - run: flutter pub get
          - name: Build Flutter for Windows
            run: >-
              flutter build windows
              --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
          - name: Package portable zip
            run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath liangciyuan-${{ env.tag }}-windows-x64.zip
          # Inno Setup 安装包：应用内更新按 *windows*x64-setup.exe 匹配资产。
          - name: Build Windows installer
            run: |
              $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
              & $iscc /DAppVersion=$env:tag /Q assets\windows\installer.iss
          - name: Upload windows outputs
            uses: actions/upload-artifact@v4
            with:
              name: windows_outputs
              path: |
                liangciyuan-*-windows-x64-setup.exe
                liangciyuan-*-windows-x64.zip

      release:
        name: "Release"
        runs-on: "ubuntu-latest"
        needs: [flutter-build-windows]
        permissions: write-all
        steps:
          - name: Clone repository
            uses: actions/checkout@v4

          - name: Download windows build files
            uses: actions/download-artifact@v4
            with:
              name: windows_outputs
              path: windows_outputs

          - name: Download android build file
            uses: actions/download-artifact@v4
            with:
              name: android_outputs
              path: android_outputs

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              files: |
                windows_outputs/*.exe
                windows_outputs/*.zip
                android_outputs/*.apk
