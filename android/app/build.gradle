plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// 发布签名：固定 keystore，保证每次构建签名一致，覆盖安装不再冲突。
// CI 通过环境变量注入（密钥内容 base64），本地回退到 android/liangciyuan-release.jks。
def releaseKeystoreFile = rootProject.file('liangciyuan-release.jks')
def hasLocalKeystore = releaseKeystoreFile.exists()
def envKeystoreB64 = System.getenv('ANDROID_KEYSTORE_BASE64')
def hasEnvKeystore = envKeystoreB64 != null && !envKeystoreB64.trim().isEmpty()

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // 凉次元独立包名，避免与上游 Kazumi（com.predidit.kazumi）互相覆盖安装。
        applicationId "com.liangciyuan.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasEnvKeystore || hasLocalKeystore) {
            release {
                storeFile hasEnvKeystore
                    ? file("${System.getenv('KEYSTORE_PATH') ?: 'liangciyuan-release.jks'}")
                    : releaseKeystoreFile
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'liangciyuan2026'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'liangciyuan'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'liangciyuan2026'
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasEnvKeystore || hasLocalKeystore
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
